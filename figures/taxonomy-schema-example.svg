<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The induced topic taxonomy and the schema attached to one concept</title>
<desc id="d">Two panels. (a) The topic taxonomy: concepts form a rooted tree, shown here as one path seven levels deep from the root, Ethical Principles and Training, down to Reporting of Ethical Violations, with the number of sibling concepts collapsed at each level. The full taxonomy holds 107 concepts and reaches depth 8. (b) The schema on one of those concepts: Reporting of Ethical Violations carries the FrameNet frame Reporting, whose four core frame elements are Informer, Wrongdoer, Authorities and Behavior. Three of the four are bound to values taken from the document — our supplier, us, and noncompliance with our expectations — each backed by a verbatim quote; Wrongdoer is left unfilled.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5d6872"/></marker></defs>
