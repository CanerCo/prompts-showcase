<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Cost of conditions A + BT against pooled gap recall</title>
<desc id="d">Scatter of five language models connected in order of increasing gap recall. Devstral-123B, Qwen3-235B and gpt-oss-120B sit cheaply at low recall, between 0.21 and 0.38, for one to two dollars. Claude Sonnet 5 reaches 0.855 recall at 37.21 dollars. GPT-5.6-terra reaches higher recall still, 0.893, for 9.63 dollars &#8212; roughly a quarter of the cost.</desc>
