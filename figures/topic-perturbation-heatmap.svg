<title id="t">Gap detection rate by reference section and perturbation type</title>
<desc id="d">A six by ten matrix. Rows are sections of the reference Code of Conduct, columns are perturbation types ordered from hardest to easiest. Darker cells mean a higher share of the 12 runs found the gap. Business integrity and Verification are lighter across nearly every column than Human rights and Environment, and the threshold column is the lightest overall.</desc>
