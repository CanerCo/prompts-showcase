<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Component-level comparison for the Reporting Violations topic</title>
<desc id="d">Three panels. (a) Topic level: a reference code and a candidate code both attach to the same taxonomy node, Reporting Violations, so a coverage comparison records the topic as present in both and sees nothing further. (b) Frame layer: the node carries a FrameNet frame, Reporting, whose core frame elements — Informer, Authorities and Behavior — state what a complete provision must specify. (c) Slot-level comparison: binding values to those three elements shows the candidate narrows the Informer from any employee or third party to permanent employees only, and omits the Authorities channel altogether, while Behavior matches. Two gaps are detected, each anchored to verbatim quotes, where topic-level alignment alone found none.</desc>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6.4" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5d6872"/></marker></defs>
