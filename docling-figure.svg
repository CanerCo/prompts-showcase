<text x="140.0" y="295.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10.5" fill="#5d6872">(page excerpt)</text>

  <!-- Panel (b) -->
  <rect x="290" y="32" width="575" height="56" rx="6" fill="none" stroke="#d8dde2" stroke-width="1.3"/>
  <rect x="300.0" y="47.0" width="80" height="26" rx="4" fill="#234f79" stroke="#234f79" stroke-width="1.2"/>
<text x="340.0" y="63.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">H</text>
<rect x="395.0" y="47.0" width="80" height="26" rx="4" fill="#f1f3f5" stroke="#d8dde2" stroke-width="1.2"/>
<text x="435.0" y="63.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5d6872">Tx</text>
<rect x="490.0" y="47.0" width="80" height="26" rx="4" fill="#234f79" stroke="#234f79" stroke-width="1.2"/>
<text x="530.0" y="63.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">H</text>
<rect x="585.0" y="47.0" width="80" height="26" rx="4" fill="#ffffff" stroke="#5d6872" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="625.0" y="63.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1d252c">DI</text>
<rect x="680.0" y="47.0" width="80" height="26" rx="4" fill="#234f79" stroke="#234f79" stroke-width="1.2"/>
<text x="720.0" y="63.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">H</text>
