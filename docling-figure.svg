<text x="140.0" y="131.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">H</text>
<rect x="100.0" y="149.0" width="80" height="26" rx="4" fill="#ffffff" stroke="#5d6872" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="140.0" y="165.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1d252c">DI</text>
<rect x="100.0" y="183.0" width="80" height="26" rx="4" fill="#234f79" stroke="#234f79" stroke-width="1.2"/>
<text x="140.0" y="199.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">H</text>
<rect x="100.0" y="217.0" width="80" height="26" rx="4" fill="#f1f3f5" stroke="#d8dde2" stroke-width="1.2"/>
<text x="140.0" y="233.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5d6872">Tx</text>
