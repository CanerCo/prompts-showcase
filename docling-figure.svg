  <!-- arrow a -> b -->
  <line x1="200.0" y1="155.0" x2="288.0" y2="62.0" stroke="#234f79" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="215.0" y="191.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10.5" fill="#234f79">layout detection</text>
<text x="215.0" y="205.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10.5" fill="#234f79">(Docling)</text>

  <!-- downward arrow -->
  <line x1="577.0" y1="132.0" x2="577.0" y2="300.0" stroke="#234f79" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="600.0" y="212.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10.5" fill="#1d252c">heading-hierarchy resolution + chunking</text>
<text x="600.0" y="226.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10.5" fill="#1d252c">(doc_chunks_to_doc_items)</text>

