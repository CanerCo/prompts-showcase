  <rect x="115.0" y="365.0" width="150" height="54" rx="6" fill="#ffffff" stroke="#d8dde2" stroke-width="1.3"/>
<text x="190.0" y="388.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">“Dear Customer”</text>
<text x="190.0" y="403.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">(H)</text>
<rect x="275.0" y="365.0" width="150" height="54" rx="6" fill="#ffffff" stroke="#d8dde2" stroke-width="1.3"/>
<text x="350.0" y="388.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">“Table of</text>
<text x="350.0" y="403.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">Contents”</text>
<rect x="435.0" y="365.0" width="150" height="54" rx="6" fill="#ffffff" stroke="#d8dde2" stroke-width="1.3"/>
<text x="510.0" y="388.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">“1. Our</text>
<text x="510.0" y="403.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">services”</text>
<rect x="595.0" y="365.0" width="150" height="54" rx="6" fill="#ffffff" stroke="#d8dde2" stroke-width="1.3"/>
<text x="670.0" y="388.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">“2. Our ownership</text>
<text x="670.0" y="403.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">structure”</text>
<rect x="755.0" y="365.0" width="150" height="54" rx="6" fill="#ffffff" stroke="#d8dde2" stroke-width="1.3"/>
<text x="830.0" y="388.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">“3. Our compliance</text>
<text x="830.0" y="403.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">policies …”</text>

  <line x1="350.0" y1="419.0" x2="350.0" y2="475.0" stroke="#5d6872" stroke-width="1.3"/>
  <rect x="304.0" y="474.0" width="92" height="32" rx="4" fill="#ffffff" stroke="#5d6872" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="350.0" y="487.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#1d252c">DOCUMENT</text>
