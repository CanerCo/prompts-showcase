<rect x="100.0" y="81.0" width="80" height="26" rx="4" fill="#f1f3f5" stroke="#d8dde2" stroke-width="1.2"/>
<text x="140.0" y="97.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5d6872">Tx</text>
