  <circle cx="70" cy="340" r="17" fill="#ffffff" stroke="#1d252c" stroke-width="1.4"/>
<text x="70" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1d252c">#/body</text>
