<text x="420.0" y="500.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="10.5" fill="#5d6872">induction (§4.1)</text>

  <line x1="830.0" y1="419.0" x2="830.0" y2="463.0" stroke="#5d6872" stroke-width="1.3"/>
