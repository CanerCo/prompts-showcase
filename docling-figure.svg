<text x="830.0" y="486.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">“3.1 Global</text>
<text x="830.0" y="501.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5" fill="#1d252c">Compliance Policy”</text>
  <line x1="830.0" y1="517.0" x2="830.0" y2="560.0" stroke="#5d6872" stroke-width="1.3"/>
  <rect x="770.0" y="561.0" width="120" height="28" rx="4" fill="#f1f3f5" stroke="#d8dde2" stroke-width="1.2"/>
<text x="830.0" y="578.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1d252c">×7 list items</text>

  <text x="460.0" y="616.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-size="11" fill="#5d6872">(c) resulting DocItem tree (complete top level)</text>
